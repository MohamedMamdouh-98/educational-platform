<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"

    />
    <!--=============== REMIXICONS ===============-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css"

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="../../../assets/css/styles.css" />
    <link rel="stylesheet" href="../../../assets/css/modules.css" />
    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"

    <title>Module Details</title>
    <style>
      .activity-section {
        margin: 50px 0;
        background: #f7ede2;
        padding: 1.5rem 2rem;
        border-radius: 2.2rem 0.8rem 2.2rem 0.8rem;
        border-left: 8px solid #b4815b;
        color: #3b2b1d;
        font-size: 1.35rem;
        line-height: 1.6;
        font-weight: 400;
        box-shadow:
          inset 0 1px 5px #f4e4d6,
          0 8px 12px -10px #8c6549;
        font-weight: bold;
      }

      .activity-title {
        color: #6b4f38;
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .activity-content {
        color: #5a4633;
        font-size: 22px;
        line-height: 1.9;
        font-weight: 500;
      }
      .activity-section ul {
        padding-inline-start: 20px;

  <body>

    <header class="header" id="header">
      <div class="header__container">
        <a href="#" class="header__logo"> </a>

          </div>
        </div>

        <div class="sidebar__content">
          <div>
            <!-- <h3 class="sidebar__title">MANAGE</h3> -->

            <div class="sidebar__list">
              <a href="/instructions/" class="sidebar__link">
                <i class="ri-information-line"></i>
                <span>Instructions</span>
              </a>

              <a href="#" class="sidebar__link">
                <i class="ri-focus-2-line"></i>
                <span>Objectives</span>
              </a>

              <a href="/pre-assessments/" class="sidebar__link">
                <i class="ri-file-list-3-fill"></i>

                <i class="ri-file-list-3-fill"></i>

          </div>
        </div>

        <div class="sidebar__actions">
          <button>
            <i
              class="ri-moon-clear-fill sidebar__link sidebar__theme"
              id="theme-button"

              <span>Theme</span>

          </button>

          <button class="sidebar__link" id="btn-log-out">

      <div class="container">
        <section class="activity-section">
          <div class="activity-title">Activity:</div>

        <div class="buttons-actions">
          <a
            href="/modules/digital-representation-of-mathematical-content/activity-3/"

    <button id="scrollTopBtn" aria-label="Scroll to top">
      <i class="fas fa-arrow-up"></i>
